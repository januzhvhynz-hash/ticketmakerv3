<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Discord ID Lookup</title>
    <style>
        /* Basic styling to keep the page tidy */
        body { font-family: Arial, sans-serif; margin: 2rem; }
        form { margin-bottom: 1rem; }
        input[type="text"] { padding: .5rem; font-size: 1rem; }
        button { padding: .5rem 1rem; font-size: 1rem; }
        #result { border: 1px solid #ddd; padding: 1rem; margin-top: 1rem; }
        #result p { margin: .5rem 0; }
        /* Make the iframe fit nicely */
        #gatecord-iframe { width: 100%; height: 520px; border: none; }
    </style>
</head>
<body>
    <!-- 🔹 1️⃣  Form to input the Discord ID -->
    <form id="discord-form">
        <label for="discord-id">Discord ID:</label>
        <input type="text" id="discord-id" name="discord-id" placeholder="Enter a Discord ID here..." required>
        <button type="submit">Lookup</button>
    </form>

    <!-- 🔹 2️⃣  Blank page (result area) -->
    <div id="result"></div>

    <!-- 🔹 3️⃣  Iframe that shows the GateCord lookup -->
    <iframe id="gatecord-iframe" src="https://gatecord.com/discord-id-lookup/" frameborder="0" style="width:100%; height:520px;"></iframe>

    <!-- 🔹 4️⃣  Script to handle the lookup -->
    <script>
        // Wait for the page to load
        window.onload = function() {
            const form = document.getElementById(’discord-form’);
            const resultDiv = document.getElementById(’result’);

            // Attach submit listener
            form.addEventListener(’submit’, function(e) {
                e.preventDefault(); // prevent default form submission

                const discordId = document.getElementById(’discord-id’).value.trim();

                // 1️⃣  Construct the URL with the Discord ID
                const lookupUrl = `https://gatecord.com/discord-id-lookup/?discordId=${discordId}`;

                // 2️⃣  Set the iframe’s source (this will load the new page)
                const iframe = document.getElementById(’gatecord-iframe’);
                iframe.src = lookupUrl;

                // 3️⃣  Parse the result once the iframe finishes loading
                iframe.onload = function() {
                    // Get the inner HTML of the iframe’s content
                    const iframeContent = iframe.contentWindow.document.body.innerHTML;

                    // 4️⃣  Build the result string
                    const resultHtml = `
                        <h2>Discord Details for ID ${discordId}</h2>
                        ${iframeContent}
                    `;

                    // 5️⃣  Append the result to the blank page above the iframe
                    resultDiv.innerHTML = resultHtml;
                };
            });
        };
    </script>
</body>
</html>
